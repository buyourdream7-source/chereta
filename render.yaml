# Render Blueprint. A persistent disk is required because the database is a file (SQLite).
# Disks need a paid Render instance type; check current pricing on render.com before choosing.
services:
  - type: web
    name: chereta
    runtime: docker
    plan: starter
    healthCheckPath: /api/state
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # you type this in the Render dashboard; never commit it
    disk:
      name: chereta-data
      mountPath: /data
      sizeGB: 5
