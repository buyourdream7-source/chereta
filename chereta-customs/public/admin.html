<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chereta Admin | Customs Commission</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="login" class="loginwrap" hidden>
  <form class="logincard" id="lf" autocomplete="on">
    <div class="lbrand"><span class="logo">C</span><div><b>Chereta Admin</b><small>Ethiopian Customs Commission</small></div></div>
    <label for="lu">Username</label><input id="lu" class="inp" autocomplete="username" autocapitalize="none">
    <label for="lp">Password</label><input id="lp" class="inp" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="lbrand"><span class="logo">C</span><div><b>Chereta</b><small>Commission admin</small></div></div>
    <nav id="nav"></nav>
    <div class="who"><b id="who"></b><button class="lnk" id="chpw">Change password</button><button class="lnk" id="out">Sign out</button><a class="lnk" href="/" target="_blank">Open public site</a></div>
  </aside>
  <div class="mainc">
    <header class="mtop"><button class="burger" id="burger" aria-label="Menu">&#9776;</button><h1 id="title"></h1><span class="spacer"></span><button class="btn sm" id="topact" hidden></button></header>
    <main id="main"></main>
  </div>
</div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast" role="status"></div>
<script src="js/admin.js"></script>
</body>
</html>
